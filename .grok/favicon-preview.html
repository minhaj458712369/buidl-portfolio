<!DOCTYPE html>
<html>
<head>
  <style>
    html, body { margin: 0; background: #3a3a3a; }
    .row { display: flex; gap: 24px; align-items: end; padding: 16px; }
    img { background: #080808; image-rendering: pixelated; }
  </style>
</head>
<body>
  <div class="row">
    <img src="favicon.svg" width="16" height="16" alt="16">
    <img src="favicon.svg" width="32" height="32" alt="32">
    <img src="favicon.svg" width="64" height="64" alt="64">
  </div>
</body>
</html>
