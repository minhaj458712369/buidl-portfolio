<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "Instrument Serif";
      font-style: normal;
      font-weight: 400;
      src: url("../fonts/InstrumentSerif-Regular.woff2") format("woff2");
    }
    @font-face {
      font-family: "Instrument Serif";
      font-style: italic;
      font-weight: 400;
      src: url("../fonts/InstrumentSerif-Italic.woff2") format("woff2");
    }
    @font-face {
      font-family: "IBM Plex Sans";
      font-style: normal;
      font-weight: 400;
      src: url("../fonts/IBMPlexSans-Latin.woff2") format("woff2");
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      background: #080808;
      overflow: hidden;
    }
    .card {
      width: 1200px;
      height: 630px;
      padding: 44px;
    }
    .frame {
      width: 100%;
      height: 100%;
      border: 1px solid #292929;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .kicker {
      margin: 0 0 32px;
      padding-left: 0.34em;
      font-family: "IBM Plex Sans", sans-serif;
      font-weight: 400;
      font-size: 15px;
      line-height: 1;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: #D6F25A;
    }
    h1 {
      margin: 0;
      text-align: center;
      font-family: "Instrument Serif", serif;
      font-weight: 400;
      font-style: normal;
      font-size: 228px;
      line-height: 0.9;
      letter-spacing: -0.025em;
      color: #F1F0EC;
    }
    h1 span {
      display: block;
    }
    h1 .surname {
      font-style: italic;
    }
    .rule {
      width: 56px;
      height: 2px;
      margin-top: 40px;
      background: #D6F25A;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="frame">
      <p class="kicker">Dhaka</p>
      <h1><span>Minhazul</span><span class="surname">Arefin</span></h1>
      <div class="rule" aria-hidden="true"></div>
    </div>
  </div>
</body>
</html>
